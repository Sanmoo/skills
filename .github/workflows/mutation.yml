name: mutation

# The full Entry Point mutates only the code changed relative to the base
# branch. This scheduled job mutates the whole codebase, as the Mutation Gate
# Contract requires.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; do not leave the token in .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          working_directory: examples/typescript
      - run: npm ci
      - run: make mutation-full
