name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; do not leave the token in .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: make check

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Secrets Gate scans history and the Mutation Gate diffs against
          # the base branch; a shallow checkout makes both silently smaller.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          working_directory: examples/typescript
      - run: npm ci
      - name: Restore the last integral result
        # A periodic check's failure must reach validation by change, so the
        # change job restores the record the integral workflow publishes. The
        # key is unique per run and the restore key takes the most recent one
        # from the base branch; with no record validation by change reports
        # "not recorded" instead of assuming a pass.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: examples/typescript/reports/integral-status.json
          key: integral-status-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            integral-status-${{ runner.os }}-
      - run: make check
