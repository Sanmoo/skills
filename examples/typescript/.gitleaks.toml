# Secrets Gate. The default rule set, extended. The path allowlist only stops
# the working-tree scan from traversing third-party code and generated output;
# it excludes no first-party file.
[extend]
useDefault = true

[allowlist]
description = "third-party code and generated output"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)reports/''',
  '''(^|/)\.stryker-tmp/''',
]
